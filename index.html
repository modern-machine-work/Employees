<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMW Employees</title>
  <link rel="icon" href="logo.svg" sizes="any" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <script>
    window.APP_VERSION = '1.0.1';
  </script>
  <script>
    document.write(`<link rel="stylesheet" href="css/main.css?v=${window.APP_VERSION}">`);
    document.write(`<link rel="stylesheet" href="css/portal.css?v=${window.APP_VERSION}">`);
  </script>
</head>
<body>
  <div id="loader" class="loader-overlay hidden" aria-live="polite" aria-label="Loading">
    <div class="spinner"></div>
  </div>

  <div id="appLayout" class="app-layout hidden">
    <aside id="sidebar" class="sidebar hidden"></aside>
    <div class="main-shell">
      <header id="navbar" class="navbar"></header>
      <main id="pageContent" class="page-content"></main>
    </div>
  </div>

  <div id="authLayout" class="auth-layout hidden">
    <main id="authContent"></main>
  </div>

  <script>
    const portalScripts = [
      'js/api.js',
      'js/app.js',
      'js/router.js',
      'js/pages/login.js',
      'js/pages/employee.js',
      'js/pages/admin.js'
    ];
    portalScripts.forEach((src) => document.write(`<script src="${src}?v=${window.APP_VERSION}"></scr` + `ipt>`));
  </script>
</body>
</html>
