<section class="login-card">
  <h1 style="display: flex;justify-content: center;">MMW</h1>
  <p>Sign in to view your profile and attendance.</p>
  <form id="loginForm" class="login-form">
    <div class="form-field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>
    <div class="form-field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="pw-toggle" type="button" id="passwordToggle" aria-label="Show password">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <p class="error-text" id="loginError"></p>
    <button class="btn primary" type="submit">Login</button>
  </form>
</section>
