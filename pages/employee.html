<div class="page-header">
  <div>
    <h1 id="employeePageTitle">My Portal</h1>
  </div>
</div>

<div class="dashboard-panel">
  <div class="panel-header">
    <h2>Today's Attendance</h2>
    <span id="todayStatusBadge" class="badge pending">Not Checked In</span>
  </div>
  <div class="attendance-actions">
    <div class="att-step" id="stepMain">
      <span class="att-label" id="mainActionLabel">Check In</span>
      <button class="btn primary" type="button" id="btnMainAction">Check In</button>
    </div>
    <div class="att-step hidden" id="stepBreak">
      <span class="att-label" id="breakLabel">Break Start</span>
      <button class="btn" type="button" id="btnBreak">Break Start</button>
    </div>
  </div>

  <div class="att-summary hidden" id="attSummary">
    <div class="att-summary-item"><span>Check In</span><strong id="sumCheckIn">—</strong></div>
    <div class="att-summary-item"><span>Break Start</span><strong id="sumBreakStart">—</strong></div>
    <div class="att-summary-item"><span>Break End</span><strong id="sumBreakEnd">—</strong></div>
    <div class="att-summary-item"><span>Check Out</span><strong id="sumCheckOut">—</strong></div>
  </div>
  <p class="muted-text" id="attendanceNote" style="margin-top:12px;"></p>
</div>

<div class="stat-grid" id="employeeStats">
  <div class="stat-card"><span>Salary Earned</span><strong id="earnedSalary">—</strong></div>
  <div class="stat-card"><span>Advance for current month</span><strong id="advance">—</strong></div>
  <div class="stat-card"><span>Total Hours</span><strong id="totalHours">—</strong></div>
</div>

<div class="dashboard-panel">
  <div class="panel-header">
    <h2>My Details</h2>
  </div>
  <div class="detail-grid" id="employeeDetails"></div>
</div>

<div class="dashboard-panel">
  <div class="panel-header">
    <h2>Attendance Calendar</h2>
    <div class="calendar-nav">
      <button class="btn small" id="prevMonthBtn" aria-label="Previous month">&#8249;</button>
      <span id="calendarMonthLabel" style="font-weight:700;"></span>
      <button class="btn small" id="nextMonthBtn" aria-label="Next month">&#8250;</button>
    </div>
  </div>
  <div id="attendanceCalendar" class="calendar-grid"></div>
  <div class="calendar-summary" id="calendarSummary">
    <span id="calendarTotalHours">Total Hours: 0.00</span>
    <span id="calendarSalaryEarned">Salary Earned: ₹ 0</span>
  </div>
  <div id="dayDetails" class="dashboard-panel hidden" style="margin-top:16px; box-shadow:none; background:#fbfdff;"></div>
  <div class="legend-row">
    <span class="legend-item"><span class="legend-swatch swatch-present"></span>Present</span>
    <span class="legend-item"><span class="legend-swatch swatch-pending"></span>Waiting approval</span>
    <span class="legend-item"><span class="legend-swatch swatch-absent"></span>Absent</span>
  </div>
</div>

<div id="dayDetailModal" class="modal-backdrop hidden">
  <div class="modal modal-day">
    <div class="modal-header">
      <h2 id="dayDetailTitle">Day Details</h2>
      <button class="btn small" type="button" id="closeDayDetailModal">Close</button>
    </div>
    <div class="day-detail-body" id="dayDetailBody"></div>
    <div class="modal-footer">
      <strong id="dayDetailTotal"></strong>
    </div>
  </div>
</div>
